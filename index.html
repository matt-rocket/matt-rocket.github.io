<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04030c;color:#9fd8ff;font:500 13px "SF Mono",ui-monospace,monospace;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
/* the aim cursor: cyan ring and arms on a dark outline, so it reads on bright blasts and dark floor alike */
#fg{cursor:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' fill='none' stroke-linecap='round'><g stroke='%2304030c' stroke-width='4.5'><path d='M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6'/><circle cx='16' cy='16' r='7'/></g><g stroke='%235ef2ff' stroke-width='2'><path d='M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6'/><circle cx='16' cy='16' r='7'/></g><circle cx='16' cy='16' r='2.2' fill='%23fff' stroke='%2304030c' stroke-width='1.4'/></svg>") 16 16,crosshair}
#hud{position:fixed;left:34px;top:22px;letter-spacing:.14em;pointer-events:none;text-shadow:0 0 12px #5ef2ff88}
#wave{position:fixed;right:34px;top:22px;text-align:right;letter-spacing:.14em;pointer-events:none;text-shadow:0 0 12px #ff4fd888}#wave i{display:block;margin-top:6px;font-style:normal;opacity:.75}
#wave b small{font-size:.5em;opacity:.55;margin-left:2px}#hud b,#wave b{display:block;font:700 32px -apple-system,"SF Pro Display",sans-serif;color:#fff;letter-spacing:.02em}
#guns{display:flex;gap:8px;margin-top:14px}#guns span{position:relative;width:46px;height:42px;padding:8px 8px 4px;border:1px solid #9fd8ff44;border-radius:5px;background:#0c0a2488;opacity:.6}#guns svg{display:block;width:100%;height:100%}#guns kbd{position:absolute;left:4px;top:2px;font:inherit;font-size:10px;letter-spacing:0}
#arty{position:relative;width:46px;height:42px;margin-top:8px;padding:8px 8px 4px;border:1px solid #ffb02044;border-radius:5px;background:conic-gradient(#ffb02040 var(--p,0%),#0c0a2488 0);opacity:.75;color:#ffb020}#arty svg{display:block;width:100%;height:100%}#arty kbd{position:absolute;left:4px;top:2px;font:inherit;font-size:10px;letter-spacing:0}#arty.ready{opacity:1;border-color:#ffd36b;color:#ffd36b;box-shadow:0 0 16px #ffd36b88,inset 0 0 10px #ffd36b44}#arty.down{opacity:.35;color:#ff4fd8;border-color:#ff4fd844}
#guns .on{color:#ffd36b;opacity:1;border-color:#ffd36b;box-shadow:0 0 14px #ffd36b66,inset 0 0 10px #ffd36b33}#guns .on svg{filter:drop-shadow(0 0 4px #ffd36baa)}#guns .locked{opacity:.22}#gun{margin-top:8px;color:#ffd36b;text-shadow:0 0 12px #ffd36baa}
#core{margin-top:14px}#core[hidden]{display:none}#wave #core b{display:inline;font:inherit;color:#5ef2ff}#core div{width:136px;height:6px;margin:6px 0 0 auto;border-radius:3px;background:#5ef2ff22}#core div i{display:block;height:100%;margin:0;border-radius:3px;background:#5ef2ff;box-shadow:0 0 10px #5ef2ffaa;opacity:1;transition:width .25s}#core.low b{color:#ff4fd8}#core.low div i{background:#ff4fd8;box-shadow:0 0 10px #ff4fd8aa}
#xp{width:136px;height:4px;margin-top:8px;border-radius:2px;background:#ffd36b22}#xp i{display:block;height:100%;width:0;border-radius:2px;background:#ffd36b;box-shadow:0 0 10px #ffd36baa;transition:width .25s}
#hp{margin-top:10px}#hp span{display:inline-block;width:22px;height:7px;margin-right:5px;border-radius:2px;background:#ff4fd8;box-shadow:0 0 10px #ff4fd8aa}#hp .gone{background:#ff4fd822;box-shadow:none}
#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#04030cb0;letter-spacing:.14em;text-shadow:0 0 12px #ff4fd888}#over[hidden]{display:none}
#over h1{font:700 40px -apple-system,"SF Pro Display",sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 0 18px #ff4fd8aa}
#over nav{display:flex;gap:14px}#over button{margin-top:12px;padding:12px 30px;font:inherit;letter-spacing:.14em;color:#04030c;background:#5ef2ff;border:0;border-radius:4px;cursor:pointer;box-shadow:0 0 18px #5ef2ff88}#over button:hover,#over button:focus-visible{background:#fff;outline:0}#over button.alt{color:#9fd8ff;background:none;border:1px solid #9fd8ff66;box-shadow:none}#over button.alt:hover,#over button.alt:focus-visible{color:#04030c;background:#9fd8ff}#over.won h1{text-shadow:0 0 18px #ffd36baa}
#pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#04030cd0;letter-spacing:.14em}#pick[hidden]{display:none}
#pick h2{font:700 30px -apple-system,"SF Pro Display",sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 0 18px #ffd36baa}
#pick{gap:14px}#cards{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px;max-height:calc(100vh - 210px);overflow-y:auto;max-width:100vw;box-sizing:border-box}#cards .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:1100px;position:relative;padding-top:20px}#cards h3{position:absolute;top:0;left:0;right:0;margin:0;font:inherit;font-size:11px;text-align:center;color:#9fd8ff;opacity:.75}
#cards .cols{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:stretch}#cards .col{display:flex;flex-direction:column;gap:7px;width:226px;padding:10px;box-sizing:border-box;border:1px solid #ff4fd833;border-radius:8px;background:#0c0a2499}#cards .col.allies{border-color:#ffd36b33}
#cards .ch{display:flex;align-items:center;gap:8px;font:700 15px -apple-system,"SF Pro Display",sans-serif;color:#fff;letter-spacing:.02em}#cards .ch .ic{width:22px;height:22px;color:#ffd36b}#cards .ch small{margin-left:auto;font:10px ui-monospace,monospace;letter-spacing:.1em}
#cards .paths{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:10px;letter-spacing:.06em;min-height:13px;margin-bottom:2px}#cards .paths i{font-style:normal;color:#ffd36b}#cards .paths i.dim{color:#9fd8ff;opacity:.55}#cards .paths u{text-decoration:none;letter-spacing:.15em;margin-left:4px}#cards .none{font-size:11px;opacity:.5;padding:8px 0}
#cards button{display:flex;flex-direction:row;align-items:center;gap:10px;width:206px;min-height:52px;padding:7px 10px;box-sizing:border-box;font:inherit;text-align:left;color:#9fd8ff;background:#0c0a24e8;border:1px solid #5ef2ff55;border-radius:6px;cursor:pointer;letter-spacing:.08em;box-shadow:0 0 18px #5ef2ff22}#cards .col button{width:100%}#cards .t{display:flex;flex-direction:column;gap:2px;min-width:0}
#cards button:hover,#cards button:focus-visible{border-color:#5ef2ff;box-shadow:0 0 24px #5ef2ff66;outline:0}#cards .weapon{border-color:#ffd36b77}#cards .weapon:hover{border-color:#ffd36b;box-shadow:0 0 24px #ffd36b66}#cards .fork{border-left:3px solid #ffd36b}
#cards small{font-size:10px;opacity:.7}#cards .weapon small{color:#ffd36b;opacity:1}#cards .tech{border-color:#ff4fd877}#cards .tech:hover{border-color:#ff4fd8;box-shadow:0 0 24px #ff4fd866}#cards .tech small{color:#ff4fd8;opacity:1}#cards b{font:700 15px -apple-system,"SF Pro Display",sans-serif;color:#fff;letter-spacing:.02em}#cards .turret small,#cards .artillery small{color:#ffd36b;opacity:1}
#cards .ic{flex:none;width:28px;height:28px;color:#5ef2ff;filter:drop-shadow(0 0 8px currentColor)}#cards .ic svg{display:block;width:100%;height:100%}#cards .weapon .ic,#cards .turret .ic,#cards .artillery .ic{color:#ffd36b}#cards .tech .ic{color:#ff4fd8}
#cards .big{max-width:720px}#cards .big button{flex-direction:column;align-items:center;text-align:center;width:220px;padding:14px 12px;gap:8px}#cards .big .t{align-items:center;gap:4px}#cards .big .ic{width:38px;height:38px}#cards .big span{font-size:12px;line-height:1.35;opacity:.85;letter-spacing:.04em}
#detail{width:min(760px,calc(100vw - 32px));min-height:66px;padding:10px 14px 0;box-sizing:border-box;border-top:1px solid #5ef2ff33;text-align:center;letter-spacing:.04em}#detail b{font:700 17px -apple-system,"SF Pro Display",sans-serif;color:#fff}#detail small{font-size:10px;opacity:.7;margin-left:10px;letter-spacing:.12em}#detail p{margin:5px 0 0;font-size:13px;color:#cfe9ff;opacity:1}#detail .op{color:#5ef2ff}#detail .cl{color:#ffd36b}
#cards .at{border-color:#5ef2ff;box-shadow:0 0 24px #5ef2ff66}#cards .weapon.at{border-color:#ffd36b;box-shadow:0 0 24px #ffd36b66}#cards .tech.at{border-color:#ff4fd8;box-shadow:0 0 24px #ff4fd866}#cards .off{opacity:.38;cursor:default;box-shadow:none}#cards .off:hover{box-shadow:none}#cards .off.at{opacity:.6}#pick p{margin:0;font-size:11px;opacity:.6}
#goal{position:fixed;left:0;right:0;top:24vh;text-align:center;letter-spacing:.34em;text-transform:uppercase;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .6s,transform .6s;text-shadow:0 0 12px #5ef2ff}#goal.on{opacity:1;transform:none}
#goal b{display:block;margin-top:10px;font:800 clamp(30px,5vw,56px) -apple-system,"SF Pro Display",sans-serif;letter-spacing:.02em;text-transform:none;color:#fff;text-shadow:0 0 22px #ffd36baa}body.title #goal{opacity:0;transition:none}#goal.wave{text-shadow:0 0 12px #ff4fd8}#goal.wave b{color:#ff4fd8;text-shadow:0 0 22px #ff4fd8aa}
#help{position:fixed;bottom:22px;width:100%;text-align:center;letter-spacing:.12em;opacity:.6;pointer-events:none}
#fs{position:fixed;right:22px;bottom:16px;width:34px;height:34px;padding:7px;color:#9fd8ff;background:none;border:1px solid #9fd8ff44;border-radius:4px;cursor:pointer;opacity:.6}#fs:hover{opacity:1;color:#5ef2ff;border-color:#5ef2ff;box-shadow:0 0 12px #5ef2ff66}#fs[hidden]{display:none}#fs svg{display:block;width:100%;height:100%}
#hud,#wave,#help,#fs{transition:opacity .9s}body.title #hud,body.title #wave,body.title #help,body.title #fs{opacity:0;transition:none}
#veil{position:fixed;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#2a1a6e 0%,#0b0626 45%,#04030c 80%)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:0 16px 4vh;text-align:center;pointer-events:none;transition:opacity .45s,transform .8s cubic-bezier(.5,0,.75,0)}#title[hidden]{display:none}
#title svg{width:clamp(120px,26vh,240px);height:auto;overflow:visible}#title .ring{transform-origin:100px 104px;animation:spin 24s linear infinite}
#title h1{font:800 clamp(40px,8.5vw,112px)/.9 -apple-system,"SF Pro Display",sans-serif;letter-spacing:.01em;text-transform:uppercase;background:linear-gradient(180deg,#fff 30%,#9fe9ff 62%,#ff8fe6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px #5ef2ff66) drop-shadow(0 0 2px #fff8)}
#title h1 em{font-style:normal;background:linear-gradient(180deg,#fff 10%,#ff8fe6 55%,#ff4fd8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#title h1 span{display:block;margin:.12em -.62em 0 0;font-size:.34em;letter-spacing:.62em;-webkit-text-fill-color:#ff4fd8;filter:drop-shadow(0 0 14px #ff4fd8)}
#arenas{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:2vh;pointer-events:auto}#arenas[hidden]{display:none}
#arenas button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:240px;padding:16px 24px 14px;font:inherit;letter-spacing:.14em;text-transform:uppercase;color:#9fd8ff;background:#0c0a24cc;border:1px solid #5ef2ff;border-radius:6px;cursor:pointer;box-shadow:0 0 24px #5ef2ff55}
#arenas b{font:700 22px -apple-system,"SF Pro Display",sans-serif;letter-spacing:.02em;text-transform:none;color:#fff}#arenas small{font-size:10px;opacity:.7}#arenas b{text-shadow:0 0 14px #5ef2ff}#arenas button:hover{box-shadow:0 0 30px #5ef2ffaa;outline:0}
#arenas .arrow{min-width:0;padding:10px 14px;font:300 30px/1 -apple-system,sans-serif;border-color:#5ef2ff55;box-shadow:none}#arenas.one .arrow{visibility:hidden}#title.go #arenas{pointer-events:none}
#title p{margin-top:2vh;letter-spacing:.34em;text-transform:uppercase;color:#cfefff;text-shadow:0 0 12px #5ef2ff;animation:blink 2.2s ease-in-out infinite}
